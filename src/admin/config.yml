backend:
  name: github
  repo: Ethanb00/sharav
  branch: main
  # Set once the Cloudflare Worker OAuth proxy is deployed (see README / OAuth setup docs).
  base_url: https://sharav-cms-auth.sharav.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "src/images/dishes"
public_folder: "/images/dishes"

collections:
  # Menu and Market Schedule used to live here, but that content now lives
  # directly on the GrapesJS-designed homepage (design/homepage.html) instead
  # of being data-driven — see /editor/. Only the handful of fields genuinely
  # shared across pages (nav/footer) stay in this from-anywhere-editable form.
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/_data/site.json"
        label: "Site Copy"
        name: "site"
        fields:
          - { label: "Business Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Browser Tab Title", name: "site_title", widget: "string" }
          - { label: "Search Engine Description", name: "site_description", widget: "text" }
          - { label: "Instagram Handle", name: "instagram_handle", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
