backend:
  name: github
  repo: Ethanb00/sharav
  branch: main
  # Set once the Cloudflare Worker OAuth proxy is deployed (see README / OAuth setup docs).
  base_url: https://sharav-cms-auth.sharav.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "src/images/dishes"
public_folder: "/images/dishes"

collections:
  - name: "menu"
    label: "Menu"
    files:
      - file: "src/_data/menu.json"
        label: "Menu Items"
        name: "menu"
        fields:
          - label: "Dishes"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "schedule"
    label: "Market Schedule"
    files:
      - file: "src/_data/schedule.json"
        label: "This Week"
        name: "schedule"
        fields:
          - label: "Stops"
            name: "items"
            widget: "list"
            summary: "{{fields.day}} — {{fields.market}}"
            fields:
              - { label: "Day", name: "day", widget: "string", hint: "e.g. Saturday" }
              - { label: "Market Name", name: "market", widget: "string", required: false, hint: "Leave blank to show \"Market & time TBA\"" }
              - { label: "Time", name: "time", widget: "string", required: false, hint: "e.g. 9am–1pm" }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/_data/site.json"
        label: "Site Copy"
        name: "site"
        fields:
          - { label: "Business Name", name: "name", widget: "string" }
          - { label: "Name (Hebrew)", name: "name_hebrew", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Browser Tab Title", name: "site_title", widget: "string" }
          - { label: "Search Engine Description", name: "site_description", widget: "text" }
          - { label: "Hero Eyebrow", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero Heading", name: "hero_heading", widget: "text" }
          - { label: "Hero Subtext", name: "hero_sub", widget: "text" }
          - { label: "About Heading", name: "about_heading", widget: "string" }
          - { label: "About Body", name: "about_body", widget: "text" }
          - { label: "Mission Statement", name: "mission", widget: "text" }
          - { label: "Menu Section Heading", name: "menu_heading", widget: "string" }
          - { label: "Menu Section Subtext", name: "menu_sub", widget: "text" }
          - { label: "Find Us Heading", name: "find_us_heading", widget: "string" }
          - { label: "Find Us Body", name: "find_us_body", widget: "text" }
          - { label: "Instagram Handle", name: "instagram_handle", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
