<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sharav — Homepage Editor</title>
  <link rel="icon" href="/images/brand/icon-color.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
  <link rel="stylesheet" href="https://unpkg.com/grapesjs-preset-webpage/dist/grapesjs-preset-webpage.min.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    #topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: #2A2010; color: #EDE2D3; gap: 12px;
    }
    #topbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #topbar .actions { display: flex; align-items: center; gap: 10px; }
    #topbar button {
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 6px;
      border: 0; cursor: pointer; background: #A45330; color: #fff;
    }
    #topbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { font-size: 12px; color: #cbb187; min-width: 160px; text-align: right; }
    #gjs { height: calc(100vh - 48px); }
    #gate {
      position: fixed; inset: 0; background: #F7F3EC; display: flex;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      z-index: 1000;
    }
    #gate p { max-width: 360px; text-align: center; color: #412E15; font-size: 14px; }
    #gate button {
      font-size: 14px; font-weight: 600; padding: 12px 22px; border-radius: 8px;
      border: 0; cursor: pointer; background: #A45330; color: #fff;
    }
  </style>
</head>
<body>

  <div id="gate">
    <p><strong>Sharav Homepage Editor</strong><br>Log in with the GitHub account that has access to this repo to load and edit the homepage design.</p>
    <button id="login-btn" type="button">Login with GitHub</button>
    <p id="gate-status"></p>
  </div>

  <div id="topbar" style="display:none">
    <h1>Sharav — Homepage Editor</h1>
    <div class="actions">
      <span id="status"></span>
      <button id="save-btn" type="button" disabled>Save to GitHub</button>
    </div>
  </div>
  <div id="gjs" style="display:none"></div>

  <script src="https://unpkg.com/grapesjs"></script>
  <script src="https://unpkg.com/grapesjs-preset-webpage"></script>
  <script src="config.js"></script>
  <script src="github.js"></script>
  <script src="editor.js"></script>
</body>
</html>
